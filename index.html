<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Olde Raleigh Whiskey Society</title>
<meta name="description" content="Olde Raleigh Distillery Whiskey Society member pickup tracker"/>
<meta name="theme-color" content="#14100a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Whiskey Society"/>
<link rel="manifest" id="pwa-manifest"/>
<link rel="apple-touch-icon" id="pwa-icon"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0f0c07 !important;font-family:Georgia,serif;color:#e8d5b0;min-height:100vh;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:rgba(200,169,110,0.15)}
/* Taps fire instantly (no double-tap-zoom wait) */
button,a,label,select,input,textarea,.ledger-row,.member-btn{touch-action:manipulation}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
button{font-family:Georgia,serif;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:Georgia,serif;outline:none;box-sizing:border-box;background:#1a1208 !important;border:1px solid #2e1f0a;border-radius:6px;padding:8px 12px;color:#e8d5b0 !important;width:100%;-webkit-text-fill-color:#e8d5b0}
select option{background:#1a1208}
textarea{resize:vertical}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 30px #1a1208 inset !important;
  -webkit-text-fill-color:#e8d5b0 !important;
  caret-color:#e8d5b0;
}
input[type=date]{color-scheme:dark;background:#1a1208 !important;color:#e8d5b0 !important}
select{background:#1a1208 !important;color:#e8d5b0 !important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0f0c07}
::-webkit-scrollbar-thumb{background:#3a2a10;border-radius:3px}

/* Overlay & Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overscroll-behavior:contain}
.modal{background:#1a1208;border:1px solid #3a2a10;border-radius:16px;padding:28px 26px;width:100%;max-width:440px;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 24px 64px rgba(0,0,0,0.7)}

/* Tabs */
.tab{padding:8px 16px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;border-radius:6px;cursor:pointer;border:1px solid transparent;color:#4a3820;background:transparent;margin:0 4px 4px 0;transition:all 0.15s}
@media(hover:hover){.tab:hover{color:#9a7840;border-color:#2e1f0a}}
.tab.active{border-color:rgba(200,169,110,0.4);color:#c8a96e;background:rgba(200,169,110,0.1)}

/* Cards & Rows */
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,0.02);border:1px solid #1a1208;border-radius:8px;margin-bottom:5px;font-size:14px}
.stat{background:rgba(200,169,110,0.05);border:1px solid #1a1208;border-radius:10px;padding:14px 12px;text-align:center}
.stat .val{font-size:30px;font-weight:bold;margin-bottom:3px;letter-spacing:-0.5px}
.stat .lbl{font-size:11px;color:#4a3820;letter-spacing:1.5px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:20px}
.section-title{font-size:11px;letter-spacing:2.5px;color:#6a5030;text-transform:uppercase;margin-bottom:12px}
.badge{font-size:11px;padding:2px 7px;border-radius:3px;display:inline-block;margin-left:5px;letter-spacing:0.5px}
.card{background:rgba(200,169,110,0.04);border:1px solid #1a1208;border-radius:12px;padding:18px 20px;margin-bottom:16px}
.gold{color:#c8a96e} .green{color:#7ec8a9} .red{color:#e05c5c} .dim{color:#4a3820}

/* Buttons */
.btn-gold{background:linear-gradient(135deg,#c8a96e,#b8945a);color:#0f0c07;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:bold;cursor:pointer;border:none;font-family:Georgia,serif;letter-spacing:0.5px;box-shadow:0 2px 8px rgba(200,169,110,0.2)}
.btn-outline{background:transparent;color:#c8a96e;border:1px solid rgba(200,169,110,0.35);border-radius:8px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:Georgia,serif}
.btn-red{background:transparent;color:#e05c5c;border:1px solid rgba(224,92,92,0.3);border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer;font-family:Georgia,serif}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:5px;cursor:pointer;font-family:Georgia,serif}
.pickup-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:8px;cursor:pointer;margin-bottom:6px;font-family:Georgia,serif;font-size:15px}
.success-msg{background:rgba(126,200,169,0.1);border:1px solid rgba(126,200,169,0.25);border-radius:10px;padding:13px 20px;text-align:center;color:#7ec8a9;font-size:14px;margin-bottom:16px}

/* Admin grouped sections */
.admin-group{background:rgba(200,169,110,0.025);border:1px solid #1a1208;border-radius:14px;padding:20px 22px;margin-bottom:18px}
.admin-group-title{font-size:11px;letter-spacing:2.5px;color:#6a5030;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.admin-group-title::after{content:"";flex:1;height:1px;background:#1a1208}

/* Ledger */
.ledger-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;margin-bottom:4px;border:1px solid transparent}
.ledger-row.picked{background:rgba(126,200,169,0.06);border-color:rgba(126,200,169,0.1)}
.ledger-row.pending{background:rgba(255,255,255,0.015);border-color:#141008}
.ledger-pill{font-size:12px;padding:4px 11px;border-radius:20px;font-weight:bold;letter-spacing:0.5px;white-space:nowrap}
.ledger-pill.done{background:rgba(126,200,169,0.12);color:#7ec8a9;border:1px solid rgba(126,200,169,0.2)}
.ledger-pill.todo{background:rgba(200,169,110,0.07);color:#8a6830;border:1px solid rgba(200,169,110,0.12)}

/* Member pickup buttons */
.member-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-radius:12px;cursor:pointer;margin-bottom:8px;font-family:Georgia,serif;font-size:17px;font-weight:bold;border:1px solid;text-align:left;transition:opacity 0.1s}
.member-btn:active{opacity:0.8}
.member-btn.mb-done{background:rgba(126,200,169,0.08);border-color:rgba(126,200,169,0.2);color:#7ec8a9}
.member-btn.mb-todo{background:rgba(200,169,110,0.05);border-color:#1e1408;color:#f0e0b0}
.member-status-chip{font-size:11px;padding:5px 13px;border-radius:20px;letter-spacing:0.5px;white-space:nowrap;font-weight:normal}
.member-status-chip.done{background:rgba(126,200,169,0.12);color:#7ec8a9;border:1px solid rgba(126,200,169,0.2)}
.member-status-chip.todo{background:rgba(200,169,110,0.08);color:#c8a96e;border:1px solid rgba(200,169,110,0.15)}

/* Bottle label */
.bottle-label{background:linear-gradient(160deg,#201608 0%,#170f09 50%,#201608 100%);border:1px solid rgba(200,169,110,0.3);border-radius:16px;padding:28px 28px 22px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.bottle-label::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(200,169,110,0.06) 0%,transparent 65%);pointer-events:none}
.bottle-label-rule{width:36px;height:1px;background:rgba(200,169,110,0.25);margin:10px auto}

/* Alpha bar */
.alpha-bar{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px;justify-content:center}
.alpha-key{padding:6px 8px;font-size:12px;border-radius:5px;min-width:30px;text-align:center;font-family:Georgia,serif;border:1px solid}
.alpha-key.has-letter{background:rgba(200,169,110,0.07);border-color:#1e1408;color:#c8a96e;cursor:pointer}
.alpha-key.no-letter{background:transparent;border-color:transparent;color:#1e1408;cursor:default}

@media(max-width:500px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
/* Touch screens (iPad): 16px text in fields stops Safari zooming in on tap; bigger tap targets on small buttons */
@media(pointer:coarse){
  input,select,textarea{font-size:16px !important}
  .btn-sm,.btn-outline,.btn-red,.btn-gold,.tab{min-height:40px}
  .modal button,.admin-group button,.row button,.ledger-row button{min-height:36px;min-width:36px}
  .alpha-key{min-height:38px;min-width:34px}
}
</style>
</head>
<body>
<div id="app" style="background:#0f0c07;min-height:100vh;"></div>
<script>
// Constants
var LOCK_MS=300000, LOW=15, MAX_EX=6;
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function getCUR(){var n=new Date();return MONTHS[n.getMonth()]+"-"+n.getFullYear();}
var CUR=getCUR();
var G={gold:"#c8a96e",green:"#7ec8a9",red:"#e05c5c"};

// Default members
// Member list is empty by default — add members via Admin > Members.
var NAMES=[];

function lastName(name){var p=name.trim().split(/\s+/);return p.length>1?p[p.length-1]:p[0];}
function pad2(n){return(n<10?"0":"")+n;}
// Local-date helpers (avoid UTC shifting "2026-10-01" into Sep 30 in Eastern time)
function todayYMD(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function parseYMD(s){var p=String(s||"").split("-");if(p.length!==3)return null;var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d.getTime())?null:d;}
function quarterOf(mo){var i=MONTHS.indexOf(String(mo).split("-")[0]);return "Q"+(i<0?1:Math.floor(i/3)+1);}
function daysSinceBackup(){var d=parseYMD(ls("or2_lastbackup",null));return d?Math.floor((new Date()-d)/86400000):999;}
function defMembers(){
  return NAMES.map(function(n,i){
    return{id:i+1,name:n,status:"active",oos:false,pickups:{},extras:{},since:"",notes:""};
  });
}

function defConfig(){
  var yr=new Date().getFullYear();
  var cfg={};
  cfg["Jan-"+yr]={blend:"Toasted Madeira",bottles:28,extrasOpen:false,notes:""};
  cfg["Feb-"+yr]={blend:"Orange Wine",bottles:18,extrasOpen:false,notes:""};
  cfg["Mar-"+yr]={blend:"Palo Cortado",bottles:46,extrasOpen:false,notes:""};
  cfg["Apr-"+yr]={blend:"Ruby Port",bottles:58,extrasOpen:false,notes:""};
  cfg["May-"+yr]={blend:"Cognac",bottles:96,extrasOpen:false,notes:""};
  return cfg;
}

// Storage
function ls(k,fb){
  try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}
  catch(e){return fb;}
}
function ss(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}
  catch(e){}
}

// App State
var A={
  mode:"pickup",
  adminOn:false,
  showReset:false,
  confirm:null,
  profile:null,
  flash:"",
  view:"dashboard",
  mSearch:"",
  adminSearch:"",
  mFilter:"all",
  hSearch:"",
  hMonth:"all",
  showAdd:false,
  showBulk:false,
  bulk:"",
  newName:"",
  newOOS:false,
  newSince:"",
  editMo:null,
  showDC:false,
  dcForm:{date:"",bottles:"",notes:"",quarter:quarterOf(CUR),month:CUR},
  showBackupWarn:false,
  adminConfirm:null,
  backfillMo:null,
  backfillSearch:"",
  _newMoMonth:null,
  _newMoYear:null,
  ledgerMo:null,
  members:ls("or2_members",null)||defMembers(),
  config:ls("or2_config",null)||defConfig(),
  dcruns:ls("or2_dcruns",[])||[]
};

var lockTimer=null;
var flashTimer=null;

// Unique member/run IDs. (The old bulk import used Date.now()+random, which collided.)
var _lastId=0;
function uid(){
  var id=Math.max(Date.now(),_lastId+1);
  while(A.members.some(function(m){return m.id===id;})||A.dcruns.some(function(r){return r.id===id;}))id++;
  _lastId=id;return id;
}
// Repair members that ended up sharing an ID. Returns the names involved.
function fixDuplicateIds(){
  var seen={},firstName={},maxId=0,pairs=[];
  A.members.forEach(function(m){var n=Number(m.id);if(!isNaN(n)&&n>maxId)maxId=n;});
  A.members=A.members.map(function(m){
    var id=Number(m.id);
    if(isNaN(id)||seen[id]){
      maxId=Math.max(maxId+1,Date.now());
      if(!isNaN(id))pairs.push(firstName[id]+" & "+m.name);
      return Object.assign({},m,{id:maxId});
    }
    seen[id]=true;firstName[id]=m.name;
    return id===m.id?m:Object.assign({},m,{id:id});
  });
  return pairs;
}
(function(){
  var pairs=fixDuplicateIds();
  if(pairs.length){
    saveAll();
    var prev=ls("or2_idfix",[])||[];
    ss("or2_idfix",prev.concat(pairs));
  }
})();

// Save helpers
function saveAll(){
  ss("or2_members",A.members);
  ss("or2_config",A.config);
  ss("or2_dcruns",A.dcruns);
}

// Computed
function getCfg(){return A.config[CUR]||{blend:"",bottles:0,extrasOpen:false,notes:""};}
function getActive(){return A.members.filter(function(m){return m.status==="active";});}
function getLocal(){return getActive().filter(function(m){return !m.oos;});}
function getOOS(){return A.members.filter(function(m){return m.oos;});}
function getPickedUp(mo){mo=mo||CUR;return A.members.filter(function(m){return m.pickups[mo]===true;}).length;}
function getExtraSold(mo){mo=mo||CUR;return A.members.reduce(function(a,m){return a+(m.extras[mo]||0);},0);}
function getDCBottles(mo){
  var m=mo||CUR;
  return A.dcruns.filter(function(r){return r.month===m;}).reduce(function(a,r){return a+r.bottles;},0);
}
function getRemaining(mo){
  mo=mo||CUR;
  var c=A.config[mo]||{bottles:0};
  return Math.max(0,(c.bottles||0)-getPickedUp(mo)-getExtraSold(mo)-getDCBottles(mo));
}
function isLow(){return getRemaining()<=LOW&&getCfg().bottles>0;}
// ---- Per-month member counts & extra pool ----
function moEnd(mo){
  var parts=mo.split("-");var mIdx=MONTHS.indexOf(parts[0]);
  var yr=parts[1]?parseInt(parts[1]):new Date().getFullYear();
  return new Date(yr,mIdx+1,0,23,59,59);
}
// Was this member part of the club in the given month? (uses join date, status, and any activity that month)
function memberInMonth(m,mo){
  if(m.pickups[mo]||m.extras[mo])return true;
  if(m.status!=="active")return false;
  if(m.since){var d=parseYMD(m.since);if(d&&d>moEnd(mo))return false;}
  return true;
}
function monthMemberList(mo){return A.members.filter(function(m){return memberInMonth(m,mo);});}
function monthCountIsSet(mo){var c=A.config[mo];return !!(c&&c.members>0);}
// Saved count if there is one, otherwise an estimate from the current member list
function getMonthMembers(mo){
  mo=mo||CUR;
  var c=A.config[mo];
  if(c&&c.members>0)return c.members;
  return monthMemberList(mo).length;
}
// Extra bottles available = bottles made - members that month - extras already sold
function getMonthPool(mo){
  mo=mo||CUR;
  var c=A.config[mo]||{bottles:0};
  return Math.max(0,(c.bottles||0)-getMonthMembers(mo)-getExtraSold(mo));
}
function getExtraPool(){return getMonthPool(CUR);}
// When a new month starts, lock in the member count we last saw for the month that just ended
function snapshotMonths(){
  var seen=ls("or2_seen",null);
  if(seen&&seen.mo&&seen.mo!==CUR&&A.config[seen.mo]&&!(A.config[seen.mo].members>0)&&seen.count>0){
    A.config[seen.mo].members=seen.count;saveAll();
  }
  if(!seen||seen.mo!==CUR||seen.count!==getMonthMembers(CUR)){ss("or2_seen",{mo:CUR,count:getMonthMembers(CUR)});}
}
function confMonths(){
  return Object.keys(A.config).filter(function(mo){
    var mc=A.config[mo];return mc&&(mc.blend||mc.bottles>0);
  }).sort(function(a,b){return moKey2Date(a)-moKey2Date(b);});
}
function moKey2Date(mo){
  var parts=mo.split("-");
  var mIdx=MONTHS.indexOf(parts[0]);
  if(mIdx===-1)return new Date(0);
  var yr=parts[1]?parseInt(parts[1]):new Date().getFullYear();
  return new Date(yr,mIdx,1);
}

// Flash message: a toast that floats above every screen and popup.
// It lives outside #app, so it shows in admin tabs and over popups, and clearing it doesn't redraw the page.
function flash(msg){
  A.flash=msg;
  if(flashTimer)clearTimeout(flashTimer);
  var t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");t.id="toast";
    t.style.cssText="position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:1000;max-width:min(560px,calc(100vw - 32px));background:#16241d;border:1px solid rgba(126,200,169,0.45);color:#7ec8a9;border-radius:10px;padding:12px 18px;font-size:14px;font-family:Georgia,serif;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,0.6);pointer-events:none;line-height:1.5;";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  flashTimer=setTimeout(function(){A.flash="";var x=document.getElementById("toast");if(x&&x.parentNode)x.parentNode.removeChild(x);},msg.length>80?6000:3000);
}
var _searchTimer=null;
function renderDebounced(){
  if(_searchTimer)clearTimeout(_searchTimer);
  _searchTimer=setTimeout(function(){render();},120);
}
function resetLock(){
  if(lockTimer)clearTimeout(lockTimer);
  lockTimer=setTimeout(function(){
    A.adminOn=false;A.mode="pickup";A.view="dashboard";
    // Close admin-only popups so they don't stay open over the member screen
    A.profile=null;A.adminConfirm=null;A.showReset=false;A.showBackupWarn=false;A.editMo=null;
    render();
  },LOCK_MS);
}

// Actions
function doPickup(id){
  var m=A.members.find(function(x){return x.id===id;});
  if(!m)return;
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var p=Object.assign({},x.pickups);p[CUR]=true;
    return Object.assign({},x,{pickups:p});
  });
  saveAll();A.confirm=null;A.mSearch="";
  flash("Enjoy your bottle, "+m.name+"!");render();
}
function undoExtra(id,mo){
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var e=Object.assign({},x.extras);
    if((e[mo]||0)>0)e[mo]=e[mo]-1;
    if(e[mo]===0)delete e[mo];
    return Object.assign({},x,{extras:e});
  });
  saveAll();flash("Extra bottle removed.");render();
}
function undoPickup(id,mo){
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var p=Object.assign({},x.pickups);delete p[mo];
    return Object.assign({},x,{pickups:p});
  });
  saveAll();flash("Pickup undone.");render();
}
function toggleHistoryPickup(id,mo){
  var m=A.members.find(function(x){return x.id===id;});
  if(!m)return;
  var already=m.pickups[mo]===true;
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var p=Object.assign({},x.pickups);
    if(already)delete p[mo];else p[mo]=true;
    return Object.assign({},x,{pickups:p});
  });
  saveAll();
  flash(already?"Removed "+mo+" pickup.":"Marked "+mo+" picked up.");
  render();
}
// mo = month key to sell the extra from (defaults to the current month)
function doExtra(id,force,mo){
  mo=mo||CUR;
  var isCurMo=(mo===CUR);
  var m=A.members.find(function(x){return x.id===id;});
  if(!m)return;
  if(isCurMo&&!m.pickups[CUR]){flash("Mark "+CUR+" picked up first.");render();return;}
  var bought=m.extras[mo]||0;
  if(bought>=MAX_EX){flash("Extra bottle limit reached ("+MAX_EX+") for "+mo+".");render();return;}
  // Current month: physical stock on hand. Past months: bottles made - that month's members - extras sold.
  var rem=isCurMo?getRemaining(mo):getMonthPool(mo);
  if(rem<=0){flash("No extra "+mo+" bottles available.");render();return;}
  // Safety check (current month only): would this leave fewer bottles than pending pickups?
  if(isCurMo){
    var pending=getActive().filter(function(x){return !x.pickups[CUR];}).length;
    if(!force&&rem-1<pending){
      // Warn but allow override
      A.adminConfirm={
        title:"Low Stock Warning",
        message:"Selling this extra would leave "+(rem-1)+" bottle"+(rem-1!==1?"s":"")+" for "+pending+" member"+(pending!==1?"s":"")+" still pending pickup. Sell anyway?",
        ok:"Yes, Sell Extra",cancel:"Cancel",danger:true,
        onOk:function(){doExtra(id,true,mo);}
      };
      A.confirm=null;render();return;
    }
  }
  A.members=A.members.map(function(x){
    if(x.id!==id)return x;
    var e=Object.assign({},x.extras);e[mo]=(e[mo]||0)+1;
    return Object.assign({},x,{extras:e});
  });
  saveAll();
  if(isCurMo)A.confirm=null; // past-month sales keep the popup open so you can add several
  flash(isCurMo?"Extra bottle added!":"Extra "+mo+" bottle added ("+getMonthPool(mo)+" extras left).");
  render();
}
// Small − / + controls for extras on a month row (used in both history lists)
function extraControls(m,mo){

function importBulk(){
  var names=A.bulk.split("\n").map(function(n){return n.trim();}).filter(function(n){return n.length>0;});
  var existingNames=A.members.map(function(m){return m.name.toLowerCase();});
  var added=0;
  var skipped=[];
  names.forEach(function(n){
    if(existingNames.indexOf(n.toLowerCase())>=0){
      skipped.push(n);
    }else{
      A.members.push({id:uid(),name:n,status:"active",oos:false,pickups:{},extras:{},since:"",notes:""});
      existingNames.push(n.toLowerCase()); // prevent in-paste duplicates too
      added++;

  });
  saveAll();A.bulk="";A.showBulk=false;
  A.members.sort(function(a,b){return lastName(a.name).localeCompare(lastName(b.name));});
  var msg=added+" member"+(added===1?"":"s")+" added!";
  if(skipped.length>0)msg+=" Skipped (already exist): "+skipped.join(", ");
  flash(msg);render();
}

function safariDownload(text,filename,mime){

  var ov=document.createElement("div");

  var sub=document.createElement("div");sub.textContent="Tap the link below to save the file.";sub.style.cssText="font-size:13px;color:#6a5030;margin-bottom:22px;font-family:Georgia,serif;";
  var link=document.createElement("a");link.href=url;link.download=filename;link.textContent=filename;
  link.style.cssText="display:block;background:linear-gradient(135deg,#c8a96e,#b8945a);color:#0f0c07;border-radius:8px;padding:14px;font-size:14px;font-weight:bold;text-decoration:none;margin-bottom:14px;font-family:Georgia,serif;";
  function closeOv(){if(ov.parentNode)ov.parentNode.removeChild(ov);}
  link.onclick=function(){setTimeout(function(){URL.revokeObjectURL(url);closeOv();},1000);};
  var cls=document.createElement("button");cls.textContent="Cancel";
  cls.style.cssText="background:transparent;color:#c8a96e;border:1px solid rgba(200,169,110,0.35);border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;font-family:Georgia,serif;";
  cls.onclick=function(){URL.revokeObjectURL(url);closeOv();};
  box.appendChild(title);box.appendChild(sub);box.appendChild(link);box.appendChild(cls);
  ov.appendChild(box);
  ov.onclick=function(ev){if(ev.target===ov){URL.revokeObjectURL(url);closeOv();}};
  document.body.appendChild(ov);
}
function buildBackupCSV(){

  var rows=[["BACKUP","2"],["DATE",today],[""],["=MEMBERS="],["ID","Name","Status","OOS","Since","Notes","Pickups","Extras"]];
  A.members.forEach(function(m){rows.push([m.id,m.name,m.status,m.oos?"1":"0",m.since||"",m.notes||"",JSON.stringify(m.pickups),JSON.stringify(m.extras)]);});
  rows.push([""],["=CONFIG="],["Month","Blend","Bottles","ExtrasOpen","Notes","Members"]);
  Object.keys(A.config).forEach(function(mo){var c=A.config[mo];if(c)rows.push([mo,c.blend||"",c.bottles||0,c.extrasOpen?"1":"0",c.notes||"",c.members>0?c.members:""]);});
  rows.push([""],["=DCRUNS="],["ID","Date","Bottles","Quarter","Month","Notes"]);
  A.dcruns.forEach(function(r){rows.push([r.id,r.date,r.bottles,r.quarter,r.month||CUR,r.notes||""]);});
  return rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\n");

// Full CSV parser: handles quoted fields that contain commas, quotes and line breaks
// (multi-line notes used to break restores).
function parseCSV(text){
  var rows=[],row=[],cur="",inq=false;
  text=String(text||"").replace(/^﻿/,"");
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inq){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inq=false;}
      else cur+=c;
    }else if(c==='"')inq=true;
    else if(c===",")
      {row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(cur);rows.push(row);row=[];cur="";
    }else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return !(r.length===1&&r[0].trim()==="");});
}
function safeJSON(s){try{var v=JSON.parse(s||"{}");return v&&typeof v==="object"?v:{};}catch(e){return {};}}
function parseBackup(text){
  var rows=parseCSV(text);
  var sec=null,rm=[],rc={},rd=[],sawDC=false,date="";
  rows.forEach(function(row){
    var k=(row[0]||"").trim();
    if(k==="=MEMBERS="){sec="m";return;}
    if(k==="=CONFIG="){sec="c";return;}
    if(k==="=DCRUNS="){sec="d";sawDC=true;return;}
    if(k==="=HELD="){sec="h";return;} // old backups may include this; ignored on restore
    if(k==="DATE"){date=(row[1]||"").trim();return;}
    if(k==="BACKUP")return;
    if(sec==="m"){
      if(k==="ID"||!(row[1]||"").trim())return;
      rm.push({id:parseInt(k),name:row[1].trim(),status:(row[2]||"").trim()||"active",oos:(row[3]||"").trim()==="1",since:(row[4]||"").trim(),notes:row[5]||"",pickups:safeJSON(row[6]),extras:safeJSON(row[7])});
    }else if(sec==="c"){
      // Keep every real month, even one with bottles but no blend name yet
      if(k==="Month"||MONTHS.indexOf(k.split("-")[0])<0)return;
      rc[k]={blend:(row[1]||"").trim(),bottles:parseInt(row[2])||0,extrasOpen:(row[3]||"").trim()==="1",notes:row[4]||""};
      var mc2=parseInt(row[5]);if(mc2>0)rc[k].members=mc2;
    }else if(sec==="d"){
      if(k==="ID"||!(row[1]||"").trim())return;
      rd.push({id:parseInt(k)||k,date:row[1].trim(),bottles:parseInt(row[2])||0,quarter:(row[3]||"").trim(),month:(row[4]||"").trim()||CUR,notes:row[5]||""});
    }
  });
  return {members:rm,config:rc,dcruns:rd,sawDC:sawDC,date:date};
}
// Ask before overwriting everything with a backup
function restoreFromText(text){
  var b;
  try{b=parseBackup(text);}catch(err){flash("Restore failed: "+err.message);render();return;}
  if(!b.members.length){flash("Could not read backup — is this a valid backup CSV?");render();return;}
  A.adminConfirm={
    title:"Restore Backup?",
    message:"This replaces ALL current data with the backup"+(b.date?" from "+b.date:"")+" ("+b.members.length+" members, "+Object.keys(b.config).length+" months). Current data is lost unless you backed it up.",
    ok:"Restore",cancel:"Cancel",danger:true,
    onOk:function(){
      A.members=b.members;
      A.config=Object.keys(b.config).length>0?b.config:defConfig();
      if(b.sawDC)A.dcruns=b.dcruns;
      var pairs=fixDuplicateIds();
      if(pairs.length)ss("or2_idfix",pairs);
      A.confirm=null;A.profile=null;A.backfillMo=null;A.ledgerMo=null;
      saveAll();flash("Restored "+b.members.length+" members!");
    }
  };
  render();
}
function restoreFile(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){restoreFromText(ev.target.result);};
  reader.readAsText(file);e.target.value="";
}

// DOM Builder
function el(tag,props,kids){
  var e=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      if(k==="cls"){e.className=props[k];}
      else if(k==="style"&&typeof props[k]==="object"){Object.assign(e.style,props[k]);}
      else if(k==="html"){e.innerHTML=props[k];}
      else if(k.substr(0,2)==="on"){e[k]=props[k];}
      else{e.setAttribute(k,props[k]);}
    });
  }
  if(kids){
    (Array.isArray(kids)?kids:[kids]).forEach(function(c){
      if(c==null||c===false||c===undefined)return;
      if(typeof c==="string"||typeof c==="number"){e.appendChild(document.createTextNode(String(c)));}
      else{e.appendChild(c);}
    });
  }
  return e;
}

// userActivity() resets the auto-lock timer. Call it on real user actions only,
// NOT from render() — otherwise flash/debounce renders reset the timer every few seconds.
function userActivity(){if(A.adminOn)resetLock();}
function render(){
  CUR=getCUR();
  // Keep dcForm.month current so DC form always defaults to current month
  if(!A.showDC)A.dcForm.month=CUR;
  snapshotMonths();
  var app=document.getElementById("app");
  // Remember which text box had the cursor so a redraw doesn't kick you out of it
  var ae=document.activeElement,focusKey=null,selS=null,selE=null,scrollY=window.scrollY||0;
  if(ae&&app.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&(ae.placeholder||ae.id)){
    focusKey={tag:ae.tagName,ph:ae.placeholder||"",id:ae.id||""};
    try{selS=ae.selectionStart;selE=ae.selectionEnd;}catch(e){}
  }
  // Remember how far each popup was scrolled so tapping inside it doesn't jump back to the top
  var modalScroll={};
  var oldModals=app.querySelectorAll("[data-k]");
  for(var mi=0;mi<oldModals.length;mi++)modalScroll[oldModals[mi].getAttribute("data-k")]=oldModals[mi].scrollTop;
  // Build the new screen off-page, then swap it in one step (one layout pass on the iPad)
  var frag=document.createDocumentFragment();
  if(A.confirm!==null){var cm=confirmModal();if(cm)frag.appendChild(cm);}
  if(A.profile!==null){var prm=profileModal();if(prm)frag.appendChild(prm);}
  if(A.showReset){var rm=resetModal();if(rm)frag.appendChild(rm);}
  if(A.showBackupWarn){var bwm=backupWarnModal();if(bwm)frag.appendChild(bwm);}
  if(A.adminConfirm){var acm=adminConfirmModal();if(acm)frag.appendChild(acm);}
  frag.appendChild(renderHeader());
  var hsp=showHomeScreenPrompt();if(hsp)frag.appendChild(hsp);
  if(A.mode==="pickup")frag.appendChild(renderPickup());
  else if(A.mode==="admin"&&A.adminOn){var adm=renderAdmin();if(adm)frag.appendChild(adm);}
  app.textContent="";
  app.appendChild(frag);
  var newModals=app.querySelectorAll("[data-k]");
  for(var mj=0;mj<newModals.length;mj++){var k=newModals[mj].getAttribute("data-k");if(modalScroll[k])newModals[mj].scrollTop=modalScroll[k];}
  if((window.scrollY||0)!==scrollY)window.scrollTo(0,scrollY);
  if(focusKey){
    var cands=app.getElementsByTagName(focusKey.tag),tgt=null;
    for(var i=0;i<cands.length;i++){
      var c=cands[i];
      if((focusKey.id&&c.id===focusKey.id)||(!focusKey.id&&focusKey.ph&&c.placeholder===focusKey.ph)){tgt=c;break;}
    }
    if(tgt){
      try{tgt.focus({preventScroll:true});}catch(e){tgt.focus();}
      try{if(selS!==null)tgt.setSelectionRange(selS,selE);}catch(e){}
      if(window.scrollY!==scrollY)window.scrollTo(0,scrollY);
    }
  }
}
// Any tap or keystroke in admin counts as activity, so auto-lock only fires when truly idle
["pointerdown","keydown","input","touchstart"].forEach(function(evt){
  document.addEventListener(evt,function(){userActivity();},true);
});
